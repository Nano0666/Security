
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title> Homepage-Nefertiti </title>
  <style>
    /* إزالة أي هوامش وجعل الصفحة تملأ الشاشة بالكامل */
    body, html { 
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* لمنع ظهور شريطي تمرير فوق بعض */
      background-color: #f4f7f6;
    }
    
    /* تنسيق الفريم ليأخذ حجم الشاشة 100% */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none; /* إزالة الحدود */
      -webkit-overflow-scrolling: touch; /* لتفعيل التمرير السلس على الموبايل */
    }
  </style>
</head>
<body>

  <!-- ضع رابط Google Apps Script (Web App) الخاص بك هنا -->

</body>
</html>
